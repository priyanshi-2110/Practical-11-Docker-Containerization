name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # -------------------------------------------------------------
  # Job 1: Linting / Code Quality Check (Supplementary Problem 1)
  # -------------------------------------------------------------
  lint:
    name: Code Quality (Lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

  # -------------------------------------------------------------
  # Job 2: Build & Automated Test Execution (Core CI Pipeline)
  # -------------------------------------------------------------
  build-and-test:
    name: Build & Automated Tests
    runs-on: ubuntu-latest
    needs: [lint] # Ensures lint passes before running tests
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm install

      - name: Run Backend Tests (Jest & Supertest)
        run: npm test
